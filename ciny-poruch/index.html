<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ціни поруч</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: a two-pane market board — shops list + map on the left, the selected shop's price tags on the right; stacks on phones */
:root {
  --bg: #f3f5f1;
  --surface: #ffffff;
  --fg: #1d2420;
  --muted: #5f6b64;
  --line: #d9dfd9;
  --accent: #1f7a4d;
  --accent-ink: #ffffff;
  --tag: #fff6c9;
  --tag-ink: #3a3200;
  --warn: #9a5b00;
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121714; --surface: #1a211d; --fg: #e6ece8; --muted: #9aa7a0; --line: #2c3631;
    --accent: #4cc38a; --accent-ink: #08130d; --tag: #3b3514; --tag-ink: #fff1a8; --warn: #f0b45a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121714; --surface: #1a211d; --fg: #e6ece8; --muted: #9aa7a0; --line: #2c3631;
  --accent: #4cc38a; --accent-ink: #08130d; --tag: #3b3514; --tag-ink: #fff1a8; --warn: #f0b45a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1200px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 60ch; }
h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; margin: 0; text-wrap: balance; }
label.lbl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: block; margin-bottom: 4px; }
select, input[type="text"], input[type="search"] {
  font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; min-width: 0;
}
button {
  font: inherit; font-weight: 600; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  border-radius: 8px; padding: 8px 14px; cursor: pointer;
}
button.ghost { background: transparent; color: var(--accent); }
button:disabled { opacity: .55; cursor: progress; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.controls .grow { flex: 1 1 220px; display: flex; gap: 8px; }
.controls .grow input { flex: 1; }
.check { display: flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); }
.status { color: var(--muted); font-size: .9rem; min-height: 1.4em; }
.status.err { color: var(--warn); }
.main { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }
#map { height: 280px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); z-index: 0; }
.shops { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.shop {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; text-align: left; color: var(--fg); font-weight: 400; width: 100%;
}
.shop[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.shop .nm { font-weight: 600; overflow-wrap: anywhere; }
.shop .meta { color: var(--muted); font-size: .85rem; grid-column: 1; overflow-wrap: anywhere; }
.shop .dist { font-family: var(--font-num); font-size: .85rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.pill { font-size: .75rem; border-radius: 99px; padding: 1px 8px; justify-self: end; align-self: center; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); }
.pill.has { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: baseline; }
.panel-head a { color: var(--accent); font-size: .85rem; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { background: transparent; color: var(--fg); border-color: var(--line); font-weight: 500; padding: 6px 12px; }
.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.prices { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.price { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.price:first-child { border-top: 0; }
.thumb { width: 72px; height: 72px; border-radius: 8px; object-fit: contain; background: #fff; border: 1px solid var(--line); display: block; }
span.thumb { background: var(--bg); }
.thumb-link { display: block; line-height: 0; }
.pname { font-weight: 500; overflow-wrap: anywhere; }
.pname .orig { display: block; color: var(--muted); font-size: .8rem; font-weight: 400; }
.pmeta { color: var(--muted); font-size: .8rem; }
.tag {
  font-family: var(--font-num); font-variant-numeric: tabular-nums; background: var(--tag); color: var(--tag-ink);
  padding: 4px 10px; border-radius: 4px 12px 12px 4px; white-space: nowrap; text-align: right; font-size: .95rem;
}
.tag s { opacity: .6; font-size: .8rem; margin-right: 4px; }
.empty { color: var(--muted); padding: 12px 0; }
.empty a { color: var(--accent); }
.mt { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 4px; vertical-align: 1px; }
.listform { display: grid; gap: 8px; }
.listform button { justify-self: start; }
textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; min-width: 0; }
.basket { display: grid; gap: 6px; }
.basket h3, .item-h { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; font-weight: 600; }
.brow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); }
.brow:first-of-type { border-top: 0; }
.brow .nm { font-weight: 600; overflow-wrap: anywhere; }
.brow .cnt, .brow .sum { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: .9rem; white-space: nowrap; }
.brow .cnt { color: var(--muted); }
.item-h { padding-top: 14px; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
.item-h b { color: var(--fg); font-size: .95rem; text-transform: none; letter-spacing: 0; }
.price.best .tag { outline: 2px solid var(--accent); }
footer { color: var(--muted); font-size: .8rem; max-width: 80ch; }
footer a { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="t-title">Ціни <span>поруч</span></h1>
      <p class="sub" id="t-sub"></p>
    </div>
    <div>
      <label class="lbl" for="lang" id="t-lang"></label>
      <select id="lang">
        <option value="uk">Українська</option>
        <option value="en">English</option>
        <option value="pl">Polski</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
      </select>
    </div>
  </header>

  <form class="controls" id="form">
    <button type="button" id="locate"></button>
    <div class="grow">
      <div style="flex:1;display:grid;min-width:0">
        <label class="lbl" for="addr" id="t-addr"></label>
        <input type="text" id="addr" autocomplete="street-address">
      </div>
      <button type="submit" class="ghost" id="t-find" style="align-self:end"></button>
    </div>
    <div>
      <label class="lbl" for="radius" id="t-radius"></label>
      <select id="radius">
        <option value="500">0,5 km</option>
        <option value="1000" selected>1 km</option>
        <option value="2000">2 km</option>
        <option value="5000">5 km</option>
      </select>
    </div>
    <label class="check"><input type="checkbox" id="mt" checked> <span id="t-mt"></span></label>
  </form>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <div class="main">
    <section style="display:grid;gap:12px;min-width:0">
      <div id="map"></div>
      <div class="panel-head"><h2 id="t-shops"></h2><span class="status" id="count"></span></div>
      <ul class="shops" id="shops"></ul>
    </section>

    <section class="panel" id="panel">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-shop" aria-selected="true"></button>
        <button type="button" role="tab" id="tab-cmp" aria-selected="false"></button>
        <button type="button" role="tab" id="tab-list" aria-selected="false"></button>
      </div>
      <div class="panel-head">
        <h2 id="ptitle"></h2>
        <span id="plinks"></span>
      </div>
      <form id="listform" class="listform" hidden>
        <label class="lbl" for="list" id="t-listlabel"></label>
        <textarea id="list" rows="5"></textarea>
        <button type="submit" id="t-listbtn"></button>
      </form>
      <div id="basket" class="basket" hidden></div>
      <input type="search" id="q" aria-label="search">
      <ul class="prices" id="prices"></ul>
    </section>
  </div>

  <footer id="t-foot"></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

/* ---------- helpers ---------- */
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function dist(a, b) {

  return 2 * R * Math.asin(Math.sqrt(h));
}

function fmtDate(d) {

  if (m) dt = new Date(+m[3], m[2] - 1, +m[1]);

async function getJSON(url, opts) {

/* ---------- translation ---------- */
const offNameCache = new Map();
async function offName(code) {
  const key = code + ":" + state.lang;
  if (offNameCache.has(key)) return offNameCache.get(key);
  const p = getJSON(`${OFF}/product/${encodeURIComponent(code)}?fields=product_name,product_name_${state.lang},lang,image_front_small_url,image_front_url`)
    .then(d => d.product ? { name: d.product[`product_name_${state.lang}`] || "", base: d.product.product_name || "", src: d.product.lang || "autodetect", img: d.product.image_front_small_url || d.product.image_front_url || "" } : null)
    .catch(() => null);
  offNameCache.set(key, p);
  return p;
}
const catCache = new Map();
async function catName(tag) {
  const key = tag + ":" + state.lang;
  if (catCache.has(key)) return catCache.get(key);
  const p = getJSON(`${OFF}/taxonomy?tagtype=categories&tags=${encodeURIComponent(tag)}&lc=${state.lang},en&fields=name`)
    .then(d => { const n = d[tag]?.name || {}; return { name: n[state.lang] || "", base: n.en || tag.replace(/^\w\w:/, "").replace(/-/g, " ") }; })
    .catch(() => ({ name: "", base: tag.replace(/^\w\w:/, "").replace(/-/g, " ") }));
  catCache.set(key, p);
  return p;
}
async function machineTranslate(text, src) {
  if (!text || !$("mt").checked) return null;
  const k = `${src}|${state.lang}|${text}`;
  if (trCache[k]) return trCache[k];
  try {
    const pair = `${src && src.length === 2 ? src : "autodetect"}|${state.lang}`;
    const d = await getJSON(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.slice(0, 400))}&langpair=${pair}`);
    const ta = document.createElement("textarea"); ta.innerHTML = d?.responseData?.translatedText || "";
    const out = ta.value;
    if (d.responseStatus !== 200 || !out || d.quotaFinished) return null;
    if (d?.responseData?.detectedLanguage === state.lang || out.toLowerCase() === text.toLowerCase()) return null;
    trCache[k] = out; store.set("trCache", trCache);
    return out;
  } catch { return null; }
}
/* Resolve a price row's display name in the selected language. */
async function nameFor(p) {
  if (p.type === "CATEGORY" && p.category_tag) {
    const c = await catName(p.category_tag);
    if (c.name) return { text: c.name };
    const mt = await machineTranslate(c.base, "en");
    return mt ? { text: mt, orig: c.base, mt: true } : { text: c.base };
  }
  const raw = dec(p.product?.product_name || p.product_name || "");
  if (p.product_code) {
    const o = await offName(p.product_code);
    if (o?.img) p._img = o.img;
    if (o?.name) return { text: o.name, orig: o.name !== raw ? raw : "" };
    const base = dec(o?.base) || raw;
    if (!base) return { text: T().none };
    if (o && o.src === state.lang) return { text: base };
    const mt = await machineTranslate(base, o?.src);
    return mt && mt.toLowerCase() !== base.toLowerCase() ? { text: mt, orig: base, mt: true } : { text: base };
  }

}

    const m = L.circleMarker([s.lat, s.lon], { radius: sel ? 9 : 6, color: has ? "#1f7a4d" : "#7b8780", fillColor: has ? "#4cc38a" : "#c9d1cc", fillOpacity: .95, weight: sel ? 3 : 1.5 })

/* ---------- shops ---------- */
// Ask every Overpass mirror at once and take the first good answer; a busy mirror can hang for minutes,
// so each request is cut off after 15 s and the caller falls back to Nominatim.
async function overpass(q) {
  const ctrls = OVERPASS.map(() => new AbortController());
  const timer = setTimeout(() => ctrls.forEach(c => c.abort()), 15000);
  try {
    return await Promise.any(OVERPASS.map((url, i) => getJSON(url, {
      method: "POST", body: "data=" + encodeURIComponent(q), signal: ctrls[i].signal,
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
    }).then(d => { if (!Array.isArray(d?.elements)) throw new Error("bad"); return d; })));
  } finally { clearTimeout(timer); ctrls.forEach(c => c.abort()); }
}
async function overpassShops(lat, lon, r) {
  const q = `[out:json][timeout:25];nwr["shop"~"^(${SHOP_TYPES.join("|")})$"](around:${r},${lat},${lon});out center tags;`;
  const d = await overpass(q);
  return d.elements.map(e => {
    const c = e.type === "node" ? e : e.center; if (!c) return null;
    const t = e.tags || {};
    return {
      key: `${e.type.toUpperCase()}:${e.id}`, osmType: e.type.toUpperCase(), osmId: e.id,
      name: t.name || t.brand || "", brand: t.brand || "", type: t.shop,
      street: [t["addr:street"], t["addr:housenumber"]].filter(Boolean).join(", "),
      lat: c.lat, lon: c.lon, d: dist(state.me, c),
    };
  }).filter(Boolean);
}
/* Fallback when every Overpass server is down or busy: Nominatim keyword search in a box around the point.
   Covers supermarkets and convenience stores only; requests are spaced to respect Nominatim's 1 req/s policy. */
async function nominatimShops(lat, lon, r) {
  const dLat = r / 111320, dLon = r / (111320 * Math.cos(lat * Math.PI / 180));
  const box = [lon - dLon, lat + dLat, lon + dLon, lat - dLat].map(v => v.toFixed(5)).join(",");
  const out = [];
  for (const [i, q] of ["supermarket", "convenience store"].entries()) {
    if (i) await new Promise(res => setTimeout(res, 1100));
    const d = await getJSON(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=40&bounded=1&addressdetails=1&viewbox=${box}&q=${encodeURIComponent(q)}`);
    for (const x of d) {
      if (x.category !== "shop") continue;
      const a = x.address || {}, c = { lat: +x.lat, lon: +x.lon };
      out.push({
        key: `${x.osm_type.toUpperCase()}:${x.osm_id}`, osmType: x.osm_type.toUpperCase(), osmId: x.osm_id,
        name: x.name || "", brand: "", type: x.type,
        street: [a.road, a.house_number].filter(Boolean).join(", "),
        ...c, d: dist(state.me, c),
      });
    }
  }
  return out;
}
async function findShops() {

  try {
    let list;
    try { list = await overpassShops(lat, lon, r); }
    catch { list = await nominatimShops(lat, lon, r); }
    const seen = new Set();
    state.shops = list.filter(s => s.d <= r * 1.05 && !seen.has(s.key) && seen.add(s.key)).sort((a, b) => a.d - b.d).slice(0, 60);
    state.prices.clear(); state.counts.clear(); state.selected = null;

}
async function countPrices() {

/* ---------- prices ---------- */
async function loadPrices(s) {
  if (state.prices.has(s.key)) return state.prices.get(s.key);
  const d = await getJSON(`${OP}/prices?location_osm_id=${s.osmId}&location_osm_type=${s.osmType}&size=100&order_by=-date`);

/* ---------- shopping list ---------- */
const COUNTRY_LANG = { FR: "fr", BE: "fr", LU: "fr", CH: "fr", DE: "de", AT: "de", ES: "es", IT: "it", PT: "pt", PL: "pl", UA: "uk", NL: "nl", CZ: "cs", RO: "ro", GB: "en", US: "en", IE: "en", CA: "en", AU: "en" };
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\p{L}\p{N}]+/gu, " ").trim();
const stems = s => norm(s).split(" ").filter(w => w.length > 1);
// whole-word match that tolerates plurals and case endings: banana/bananas, oeuf/oeufs, молоко/молока
const wordIs = (w, term) => w === term || w === term + "s" || w === term + "es" || w === term + "x"
  || (term.length > 5 && w.length <= term.length + 1 && w.startsWith(term.slice(0, -2)));
async function translateTerm(text, to) {
  if (to === state.lang) return text;
  const k = `${state.lang}|${to}|${text}`;
  if (trCache[k]) return trCache[k];
  try {
    const d = await getJSON(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${state.lang}|${to}`, { timeout: 8000 });
    const ta = document.createElement("textarea"); ta.innerHTML = d?.responseData?.translatedText || "";
    if (d.responseStatus !== 200 || !ta.value || d.quotaFinished) return null;
    trCache[k] = ta.value; store.set("trCache", trCache);
    return ta.value;
  } catch { return null; }
}
function haystack(p) {
  if (!p._words) {
    p._cats = (p.product?.categories_tags || []).concat(p.category_tag ? [p.category_tag] : [])
      .map(c => norm(c.replace(/^\w\w:/, "").replace(/-/g, " ")).split(" "));
    p._words = norm([p.product?.product_name, p.product_name].join(" ")).split(" ");
  }

}
// 2 = a category names exactly this kind of product (its last word is the term: "semi-skimmed-milks" for milk,

function score(p, variants) {

  for (const v of variants) {

    const head = v[v.length - 1];
    if (p._cats.some(c => wordIs(c[c.length - 1], head) && v.every(t => c.some(w => wordIs(w, t))))) return 2;
    if (v.every(t => p._words.some(w => wordIs(w, t)))) best = 1;

/* Turkey: the government price-comparison service marketfiyati.org.tr (TÜBİTAK) covers A101, BİM, ŞOK, Migros, CarrefourSA…

async function marketFiyati(item, radiusM) {
  // the store catalogue names singular items ("armut", not "armutlar")
  const kw = (await translateTerm(item, "tr") || item).split(" ").map(w => w.length > 5 ? w.replace(/(lar|ler)$/i, "") : w).join(" ");
  const ask = km => getJSON("https://api.marketfiyati.org.tr/api/v2/search", {
    method: "POST", headers: { "Content-Type": "application/json" }, timeout: 12000,
    body: JSON.stringify({ keywords: kw, latitude: state.me.lat, longitude: state.me.lon, distance: km, size: 24, pages: 0 }),
  });
  // diag ends up on screen so a failure can be told apart: blocked by the browser, HTTP error, or simply nothing found
  const diag = { kw, error: "", found: 0, depots: 0 };
  let d;
  try {
    d = await ask(Math.max(1, Math.round(radiusM / 1000)));
    if (!(d.content || []).length) d = await ask(5);
  } catch (e) {
    diag.error = e instanceof TypeError ? "blocked" : (e.name === "TimeoutError" || e.name === "AbortError") ? "timeout" : "HTTP " + e.message;
    return { rows: [], diag };
  }
  diag.found = d.numberOfFound ?? (d.content || []).length;
  const rows = [];
  for (const c of d.content || []) {
    for (const x of c.productDepotInfoList || []) {
      diag.depots++;
      const pos = { lat: +x.latitude, lon: +x.longitude };
      const dd = isFinite(pos.lat) && pos.lat ? dist(state.me, pos) : NaN;
      if (dd > 10000) continue;
      rows.push({
        price: +x.price, currency: "TRY", date: x.indexTime || null,
        product: { product_name: [c.brand, c.title].filter(Boolean).join(" "), image_url: c.imageUrl, quantity: c.refinedVolumeOrWeight || "" },
        _src: "tr",
        _shop: { key: "MF:" + x.depotId, name: `${(x.marketAdi || "").toUpperCase()} ${x.depotName || ""}`.trim(), type: "supermarket", d: isFinite(dd) ? dd : 0 },

let listToken = 0;

      .sort((a, b) => b.s - a.s || a.p.price - b.p.price);

  }

  }

    if (r.top.length > 4) { const m = document.createElement("li"); m.className = "pmeta"; m.style.listStyle = "none"; m.textContent = t.listMore(r.top.length - 4); ul.appendChild(m); }
  }

}

async function geocode(e) {
  e.preventDefault();
  const q = $("addr").value.trim(); if (!q) return;
  setStatus(T().geocoding);
  try {
    const d = await getJSON(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`);
    if (!d.length) { setStatus(T().notFound, true); return; }
    state.me = { lat: +d[0].lat, lon: +d[0].lon }; store.set("me", state.me);
    findShops();
  } catch { setStatus(T().notFound, true); }
}

/* ---------- language ---------- */
function applyLang() {
  const t = T();
  document.documentElement.lang = state.lang;
  document.title = t.title.replace(/<[^>]+>/g, "");
  $("t-title").innerHTML = t.title; $("t-sub").textContent = t.sub; $("t-lang").textContent = t.lang;
  $("locate").textContent = t.locate; $("t-addr").textContent = t.addr; $("t-find").textContent = t.find;
  $("t-radius").textContent = t.radius; $("t-mt").textContent = t.mt; $("t-shops").textContent = t.shops;
  $("tab-shop").textContent = t.tabShop; $("tab-cmp").textContent = t.tabCmp; $("t-foot").innerHTML = t.foot;
  $("tab-list").textContent = t.tabList; $("t-listlabel").textContent = t.listLabel; $("t-listbtn").textContent = t.listBtn; $("list").placeholder = t.listPh;
  $("lang").value = state.lang;
  renderShops(); renderPanel(); drawMap();
}

$("lang").addEventListener("change", e => { state.lang = e.target.value; store.set("lang", state.lang); applyLang(); });
$("locate").addEventListener("click", locate);
$("form").addEventListener("submit", geocode);
$("radius").addEventListener("change", () => state.me && findShops());
$("mt").addEventListener("change", () => renderPanel());
$("tab-shop").addEventListener("click", () => { state.tab = "shop"; renderPanel(); });
$("tab-cmp").addEventListener("click", () => { state.tab = "cmp"; renderPanel(); });
$("q").addEventListener("input", applyFilter);
$("tab-list").addEventListener("click", () => { state.tab = "list"; renderPanel(); });
$("listform").addEventListener("submit", searchList);
$("list").value = store.get("list", "");

initMap();
applyLang();
const saved = store.get("me", null);
if (saved) { state.me = saved; findShops(); }
</script>
</body>
</html>
