<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SlideForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="header">
      <h1>SlideForge</h1>
      <p class="sub">Як у нормальних carousel-мейкерів: текст → слайди → правки → PNG.</p>
    </header>
    <section class="panel">
      <label for="input">Тема або чернетка</label>
      <textarea id="input" rows="5" placeholder="Наприклад: чому просто відпусти — погана порада при тривозі"></textarea>
      <div class="row">
        <div>
          <label for="tone">Тон</label>
          <select id="tone">
            <option value="warm">Теплий</option>
            <option value="direct">Прямий</option>
            <option value="expert">Експертний</option>
          </select>
        </div>
        <div>
          <label for="overlay">Текст</label>
          <select id="overlay">
            <option value="light">Темний текст</option>
            <option value="dark">Світлий текст</option>
          </select>
        </div>
        <div>
          <label for="font">Шрифт</label>
          <select id="font">
            <option value="serif">Georgia</option>
            <option value="sans">Manrope</option>
            <option value="display">Playfair</option>
          </select>
        </div>
        <div>
          <label for="size">Розмір</label>
          <select id="size">
            <option value="s">S</option>
            <option value="m" selected>M</option>
            <option value="l">L</option>
          </select>
        </div>
      </div>
      <label>Фон</label>
      <div id="bgGrid" class="bg-grid"></div>
      <div class="row actions">
        <button id="generate" type="button">Згенерувати</button>
        <span id="quota" class="muted"></span>
      </div>
      <p id="error" class="error" hidden></p>
    </section>
    <section class="preview-wrap">
      <div class="phone">
        <div id="slide" class="slide">
          <div class="slide-inner">
            <div class="topbar">
              <span id="slideType" class="badge">hook</span>
              <span id="slideNum" class="num">1 / 1</span>
            </div>
            <h2 id="slideTitle" contenteditable="true" spellcheck="false">Натисни Згенерувати</h2>
            <p id="slideBody" contenteditable="true" spellcheck="false">Потім правиш текст прямо на слайді — як у Canva.</p>
            <div class="brand">SlideForge</div>
          </div>
        </div>
      </div>
      <div class="dots" id="dots"></div>
      <div class="nav">
        <button id="prev" type="button" disabled>←</button>
        <span id="counter">0 / 0</span>
        <button id="next" type="button" disabled>→</button>
      </div>
      <div id="filmstrip" class="filmstrip"></div>
      <div class="row actions">
        <button id="download" type="button" disabled>Завантажити PNG</button>
        <button id="downloadAll" type="button" disabled>Усі PNG</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>

</body>
</html>
